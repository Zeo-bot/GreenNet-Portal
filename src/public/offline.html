<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenNet - بدون اتصال</title>
    <meta name="theme-color" content="#16a34a">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8fafc;
            font-family: Arial, sans-serif;
            color: #0f172a;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            width: min(420px, 100%);
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 28px;
            padding: 26px;
            box-shadow: 0 18px 60px rgba(15, 23, 42, 0.10);
            text-align: center;
        }

        .icon {
            width: 74px;
            height: 74px;
            border-radius: 22px;
            background: #16a34a;
            color: #ffffff;
            display: grid;
            place-items: center;
            font-size: 34px;
            font-weight: 900;
            margin: 0 auto 18px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.9;
            font-size: 15px;
        }

        a {
            display: inline-flex;
            margin-top: 18px;
            background: #16a34a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 16px;
            padding: 12px 18px;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">G</div>
        <h1>لا يوجد اتصال حالياً</h1>
        <p>
            تعذر تحميل الصفحة لأن الاتصال غير متوفر.
            تأكد من الشبكة ثم أعد المحاولة.
        </p>
        <a href="/dashboard">إعادة المحاولة</a>
    </div>
</body>
</html>
