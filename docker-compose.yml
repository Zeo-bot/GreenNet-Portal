services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: greennet_php

    volumes:
      - ./src:/var/www

    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: greennet_nginx

    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

    restart: unless-stopped