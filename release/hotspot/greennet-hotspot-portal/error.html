<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11945a">
    <title>تعذر إكمال الطلب | GreenNet</title>
    <link rel="stylesheet" href="css/greennet-hotspot.css">
</head>
<body data-page="error">
<main class="portal-shell">
    <section class="portal-card" aria-labelledby="page-title">
        <header class="brand brand-compact">
            <img src="img/greennet-logo.jpg" alt="GreenNet" width="72" height="72">
            <div>
                <p class="eyebrow">GreenNet</p>
                <h1 id="page-title">تعذر إكمال الطلب</h1>
                <p id="fatal-error-message">حاول مرة أخرى بعد قليل.</p>
            </div>
        </header>
        <div class="notice notice-error">
            <details>
                <summary>تفاصيل تقنية</summary>
                <span id="router-error-raw">$(error)</span>
            </details>
        </div>
        <a class="button button-primary" href="$(link-login)">العودة إلى تسجيل الدخول</a>
    </section>
</main>
<script src="js/config.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
